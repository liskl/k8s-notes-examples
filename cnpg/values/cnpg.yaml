# Field Guide 07: the CloudNativePG operator chart 0.29.1 (appVersion 1.30.1), with the image pinned by
# digest. The chart writes this string into the Deployment and into OPERATOR_IMAGE_NAME, the image the
# operator copies its instance manager from, so every Cluster's bootstrap-controller runs the same pinned
# image. The operator runs on lab-worker, the node the book never stops: a node that goes down takes the
# Pods on it with it, and with the operator on it nothing would fail over until Kubernetes moved the
# operator (300 s after the node went NotReady). Every upgrade passes this file again: Helm starts each
# upgrade from the chart's defaults.
image:
  tag: "1.30.1@sha256:923c267ec29636db3bee20f993d0ec4973fa22998e1adad37da79e4d32b5bc07"
nodeSelector:
  kubernetes.io/hostname: lab-worker
