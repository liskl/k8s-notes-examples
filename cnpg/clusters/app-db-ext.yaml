# Chapter 8: pgvector as an image volume: the extension's files come from their own image, mounted into
# every instance, so the book keeps the minimal PostgreSQL image. Adding it rolls the cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
  namespace: apps
spec:
  instances: 3
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  smartShutdownTimeout: 0
  storage:
    size: 1Gi
  postgresql:
    parameters:
      work_mem: "8MB"
      max_connections: "150"
    synchronous:
      method: any
      number: 1
      dataDurability: required
    pg_hba:
    - hostssl app auditor all cert
    extensions:
    - name: pgvector
      image:
        reference: "ghcr.io/cloudnative-pg/pgvector:0.8.7-202611010824-18-trixie@sha256:\
          b8ec0354be4909a2c1380ea7aaaa9f27dd8e8bb614c4687762ac052338c1e534"
  managed:
    roles:
    - name: reporter
      ensure: present
      login: true
      inRoles:
      - pg_read_all_data
      passwordSecret:
        name: reporter-password
