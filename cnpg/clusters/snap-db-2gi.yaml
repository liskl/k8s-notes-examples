# Chapter 7: snap-db with 2Gi for its data, grown online: the driver can expand a volume while it is in use.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: snap-db
  namespace: apps
spec:
  instances: 2
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  storage:
    size: 2Gi
    storageClass: csi-hostpath-sc
  walStorage:
    size: 1Gi
    storageClass: csi-hostpath-sc
  tablespaces:
  - name: archive
    storage:
      size: 1Gi
      storageClass: csi-hostpath-sc
