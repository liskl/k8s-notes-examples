# Chapter 12: snap-db with snapshot backups (the class csi-hostpath-snapclass, for every volume) and its WAL
# archived through the plugin, so a snapshot plus the WAL can reach any time after it. Adding the plugin
# restarts both instances.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: snap-db
  namespace: apps
spec:
  instances: 2
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  storage:
    size: 2Gi
    storageClass: csi-hostpath-sc
  walStorage:
    size: 1Gi
    storageClass: csi-hostpath-sc
  tablespaces:
  - name: archive
    storage:
      size: 1Gi
      storageClass: csi-hostpath-sc
  backup:
    volumeSnapshot:
      className: csi-hostpath-snapclass
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: rustfs
