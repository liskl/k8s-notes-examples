# Chapter 3: max_connections raised too. It needs a restart: the operator restarts the replicas one at a
# time, then the primary.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
  namespace: apps
spec:
  instances: 3
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  storage:
    size: 1Gi
  postgresql:
    parameters:
      work_mem: "8MB"
      max_connections: "150"
