# Chapter 5: the mitigation for an asynchronous cluster's lost writes. A commit waits for one standby to
# have it (method any, number 1) and, with dataDurability required, waits rather than go on alone when no
# standby answers. smartShutdownTimeout 0 skips the smart part of a primary's shutdown, so an isolated
# primary stops accepting writes at once (on 1.30.x it could go on for up to 180 s: CloudNativePG issue
# #11280, fixed in 1.31).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
  namespace: apps
spec:
  instances: 3
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  smartShutdownTimeout: 0
  storage:
    size: 1Gi
  postgresql:
    parameters:
      work_mem: "8MB"
      max_connections: "150"
    synchronous:
      method: any
      number: 1
      dataDurability: required
