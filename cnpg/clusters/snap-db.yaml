# Chapter 7: a Cluster on the hostpath driver's class, csi-hostpath-sc: a claim for the data, one for the
# WAL (walStorage) and one for a tablespace, each instance. The driver keeps every volume on its one node,
# so both instances run on lab-worker3 (the anti-affinity is only preferred). Chapter 12 takes volume
# snapshots of it.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: snap-db
  namespace: apps
spec:
  instances: 2
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  storage:
    size: 1Gi
    storageClass: csi-hostpath-sc
  walStorage:
    size: 1Gi
    storageClass: csi-hostpath-sc
  tablespaces:
  - name: archive
    storage:
      size: 1Gi
      storageClass: csi-hostpath-sc
