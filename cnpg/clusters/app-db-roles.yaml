# Chapter 8: a role the operator keeps in the Cluster's spec: reporter, who can log in and read everything,
# with its password from a Secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
  namespace: apps
spec:
  instances: 3
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  smartShutdownTimeout: 0
  storage:
    size: 1Gi
  postgresql:
    parameters:
      work_mem: "8MB"
      max_connections: "150"
    synchronous:
      method: any
      number: 1
      dataDurability: required
  managed:
    roles:
    - name: reporter
      ensure: present
      login: true
      inRoles:
      - pg_read_all_data
      passwordSecret:
        name: reporter-password
