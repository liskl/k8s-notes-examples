# Chapter 2: the same Cluster on an image the book pins: PostgreSQL 18.6, the minimal flavour (the
# operator's default, system, is deprecated upstream), by its dated tag and digest. The webhook reads the
# major version from the tag, so a bare digest is refused.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
  namespace: apps
spec:
  instances: 3
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  storage:
    size: 1Gi
