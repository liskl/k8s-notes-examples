# Chapter 14: app-db with the book's custom query (monitoring/app-db-queries.yaml) added to the default
# ones.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db
  namespace: apps
spec:
  instances: 3
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  smartShutdownTimeout: 0
  storage:
    size: 1Gi
  postgresql:
    parameters:
      work_mem: "8MB"
      max_connections: "150"
    synchronous:
      method: any
      number: 1
      dataDurability: required
    pg_hba:
    - hostssl app auditor all cert
    extensions:
    - name: pgvector
      image:
        reference: "ghcr.io/cloudnative-pg/pgvector:0.8.7-202611010824-18-trixie@sha256:\
          b8ec0354be4909a2c1380ea7aaaa9f27dd8e8bb614c4687762ac052338c1e534"
  managed:
    roles:
    - name: reporter
      ensure: present
      login: true
      inRoles:
      - pg_read_all_data
      passwordSecret:
        name: reporter-password
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: rustfs
  certificates:
    serverTLSSecret: app-db-server-own
    serverCASecret: app-db-own-ca
  replica:
    primary: app-db
    source: app-db-dr
  externalClusters:
  - name: app-db
    connectionParameters:
      host: app-db-rw.apps.svc
      user: streaming_replica
      sslmode: verify-full
      dbname: postgres
    sslKey:
      name: app-db-replication
      key: tls.key
    sslCert:
      name: app-db-replication
      key: tls.crt
    # app-db's server certificate is signed by the book's own CA since chapter 10
    sslRootCert:
      name: app-db-own-ca
      key: ca.crt
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: rustfs
        serverName: app-db
  - name: app-db-dr
    connectionParameters:
      host: app-db-dr-rw.apps-dr.svc
      user: streaming_replica
      sslmode: verify-full
      dbname: postgres
    sslKey:
      name: app-db-dr-replication
      key: tls.key
    sslCert:
      name: app-db-dr-replication
      key: tls.crt
    sslRootCert:
      name: app-db-dr-ca
      key: ca.crt
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: rustfs
        serverName: app-db-dr
  monitoring:
    customQueriesConfigMap:
    - name: app-db-queries
      key: queries
