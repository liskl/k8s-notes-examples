# csi-driver-host-path v1.19.0, the standard deployment (deploy/kubernetes-latest/hostpath at the tag): one
# StatefulSet with every sidecar, in default, so every volume of csi-hostpath-sc lives on its one node. It
# is a test driver: no HA, and its volumes have no size limit. Changed from upstream: every image by digest,
# hostpathplugin v1.19.0 (the tag's manifest names v1.18.0), and the StatefulSet pinned to lab-worker3. The
# four rbac-*.yaml files are the sidecars' own, at the versions the StatefulSet runs (upstream's deploy.sh
# fetches them; here they are kept with the rest): external-provisioner v6.4.0, external-attacher v4.13.0,
# external-snapshotter v8.7.0, external-resizer v2.3.0.
resources:
- rbac-external-provisioner.yaml
- rbac-external-attacher.yaml
- rbac-csi-snapshotter.yaml
- rbac-external-resizer.yaml
- csi-hostpath-driverinfo.yaml
- csi-hostpath-plugin.yaml
- csi-hostpath-storageclass.yaml
- csi-hostpath-snapshotclass.yaml
