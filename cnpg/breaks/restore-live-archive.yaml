# Chapter 11, on purpose: the same recovery, archiving under the SOURCE's name. The bucket already holds
# app-db's WAL there, so the operator refuses to start it rather than mix two clusters' WAL in one place.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db-trap
  namespace: apps
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  storage:
    size: 1Gi
  bootstrap:
    recovery:
      source: app-db
      recoveryTarget:
        targetTime: "TARGET_TIME"
  externalClusters:
  - name: app-db
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: rustfs
        serverName: app-db
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: rustfs
      serverName: app-db
