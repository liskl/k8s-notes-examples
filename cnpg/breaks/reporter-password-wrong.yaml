# Chapter 14, on purpose: the role reporter's Secret written again with its password under the wrong key
# (pass). The operator cannot apply it: the role stays as it was, and the Cluster still says it is healthy;
# only status.managedRolesStatus says why. roles/reporter-password.yaml puts it right.
apiVersion: v1
kind: Secret
metadata:
  name: reporter-password
  namespace: apps
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: reporter
  pass: lab-reporter-not-a-secret
