# Chapter 6, on purpose: four instances that must each have a node to themselves (required anti-affinity),
# on a lab with three workers. Three run; the fourth waits Pending for a node that does not exist.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: spread-db
  namespace: apps
spec:
  instances: 4
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  storage:
    size: 1Gi
  affinity:
    podAntiAffinityType: required
