# Chapter 14, on purpose: a one-instance Cluster that archives to the lab's bucket with the right access key
# and the wrong secret key. It starts and says it is healthy; its WAL never reaches the bucket, and only the
# ContinuousArchiving condition and the plugin's sidecar say why.
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-wrong-keys
  namespace: apps
stringData:
  ACCESS_KEY_ID: lab-backups
  ACCESS_SECRET_KEY: not-the-lab-key
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: rustfs-wrong
  namespace: apps
spec:
  configuration:
    destinationPath: s3://backups/
    endpointURL: http://rustfs.rustfs:9000
    s3Credentials:
      accessKeyId:
        name: rustfs-wrong-keys
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: rustfs-wrong-keys
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: badkey-db
  namespace: apps
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  storage:
    size: 1Gi
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: rustfs-wrong
