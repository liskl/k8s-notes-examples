# Chapter 8: the password of the role reporter, a lab-only string published with the book. The label tells
# the operator to apply a new password when this Secret changes.
apiVersion: v1
kind: Secret
metadata:
  name: reporter-password
  namespace: apps
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: reporter
  password: lab-reporter-not-a-secret
