# Chapter 12: a new Cluster from the cold snapshot backup, by the Backup's name: the operator finds the
# snapshots of each volume in the Backup's status. Its spec has the same volumes as snap-db.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: snap-db-copy
  namespace: apps
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  storage:
    size: 2Gi
    storageClass: csi-hostpath-sc
  walStorage:
    size: 1Gi
    storageClass: csi-hostpath-sc
  tablespaces:
  - name: archive
    storage:
      size: 1Gi
      storageClass: csi-hostpath-sc
  bootstrap:
    recovery:
      backup:
        name: snap-db-cold
