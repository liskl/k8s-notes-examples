# Chapter 11: a point-in-time recovery of app-db into a new Cluster, app-db-pitr: its base backup and WAL
# from the bucket (serverName app-db), replayed up to the target time below, a placeholder the page fills
# in (in UTC). It archives its own WAL under its own name, app-db-pitr (the plugin's default, the
# Cluster's name).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: app-db-pitr
  namespace: apps
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  storage:
    size: 1Gi
  bootstrap:
    recovery:
      source: app-db
      recoveryTarget:
        targetTime: "TARGET_TIME"
  externalClusters:
  - name: app-db
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: rustfs
        serverName: app-db
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: rustfs
