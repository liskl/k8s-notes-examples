# Chapter 9: a second pooler, in front of the replicas (app-db-ro).
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: app-db-pooler-ro
  namespace: apps
spec:
  cluster:
    name: app-db
  type: ro
  instances: 1
  pgbouncer:
    poolMode: transaction
  template:
    spec:
      containers:
      - name: pgbouncer
        image: "ghcr.io/cloudnative-pg/pgbouncer:1.25.2@sha256:\
          b15c428057d1ffbc19fb70496911a5f1a47066dcc1315bf794f4e85ade29e2e5"
