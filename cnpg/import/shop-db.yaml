# Chapter 13: a new Cluster that starts as a logical copy of app-db's database app (pg_dump and pg_restore,
# run by the operator): the microservice import, one database, any major version, no WAL. It connects as
# app, with the password from app-db's Secret, over TLS, and checks app-db's certificate against the
# book's CA.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shop-db
  namespace: apps
spec:
  instances: 1
  imageName: "ghcr.io/cloudnative-pg/postgresql:18.6-202610260820-minimal-trixie@sha256:\
    64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318"
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      import:
        type: microservice
        databases:
        - app
        source:
          externalCluster: app-db
  externalClusters:
  - name: app-db
    connectionParameters:
      host: app-db-rw.apps.svc
      user: app
      dbname: app
      sslmode: verify-full
    # app-db's server certificate is signed by the book's own CA since chapter 10
    sslRootCert:
      name: app-db-own-ca
      key: ca.crt
    password:
      name: app-db-app
      key: password
