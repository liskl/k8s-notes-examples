# Chapter 13: the same Kustomization with the packages layer's expression: a Provider is healthy when its
# condition Healthy is True. Flux now waits for that, for as long as timeout says, and then says no.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unpullable-checked
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 1m
  sourceRef:
    kind: GitRepository
    name: examples
  path: ./crossplane/gitops/breaks/unpullable-checked
  prune: true
  wait: true
  healthCheckExprs:
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    current: status.conditions.exists(e, e.type == 'Healthy' && e.status == 'True')
