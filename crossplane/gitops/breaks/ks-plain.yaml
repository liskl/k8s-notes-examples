# Chapter 13: a Kustomization around the unpullable Provider with wait: true and nothing more. Flux
# looks for a condition named Ready, finds none on a Provider, and calls it healthy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unpullable-plain
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 1m
  sourceRef:
    kind: GitRepository
    name: examples
  path: ./crossplane/gitops/breaks/unpullable-plain
  prune: true
  wait: true
