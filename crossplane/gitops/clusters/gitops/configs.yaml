# Layer 3: what a provider needs before anyone uses it: a team's namespace, and in it a ProviderConfig.
# That kind comes out of provider-kubernetes's package, so this layer waits for the packages. It has
# nothing with a condition worth waiting on (a ProviderConfig has no Ready).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: configs
  namespace: flux-system
spec:
  dependsOn:
  - name: packages
  interval: 10m
  retryInterval: 30s
  timeout: 2m
  sourceRef:
    kind: GitRepository
    name: examples
  path: ./crossplane/gitops/configs
  prune: true
  wait: true
