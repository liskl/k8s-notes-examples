# Chapter 5: one Secret, two readers. CloudNativePG reads username and password (it is the Cluster's
# superuserSecret). provider-sql reads all four keys (it is the ProviderConfig's connection Secret).
# The password is not in this file: one command adds it on the lab, and nothing ever prints it.
# The label makes CloudNativePG apply a later change of the password.
apiVersion: v1
kind: Secret
metadata:
  name: pg-admin
  namespace: data
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  endpoint: pg-rw.data.svc
  port: "5432"
