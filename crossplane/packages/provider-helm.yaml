# provider-helm v1.5.0, pinned by tag and digest, under an account with a fixed name, the same way as
# provider-kubernetes. It carries its own Helm (v4) inside: the helm on your laptop plays no part (chapter 4).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-helm
  namespace: crossplane-system
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-helm
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          serviceAccountName: provider-helm
          containers:
          - name: package-runtime
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-helm
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-helm:v1.5.0@sha256:8d728a9e5243ab0033a0edca3f897e015d8d118aae65388d691c40f867ca68fe
  runtimeConfigRef:
    name: provider-helm
