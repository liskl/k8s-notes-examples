# Chapter 14: a NetworkPolicy a team might write to "lock down" its database: the instances of the
# Cluster ha take connections from their own namespace and from the CloudNativePG operator's, and from
# nowhere else. provider-sql lives in crossplane-system, so it is locked out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-locked-down
  namespace: team-d
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: ha
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: ["team-d", "cnpg-system"]
