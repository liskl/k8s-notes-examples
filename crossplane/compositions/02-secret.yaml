# Chapter 8, stage 2: a second step, and a second function. Patches copy and reshape values; they
# cannot make one. A short template makes the admin Secret with a random password, and reads the password
# back from the Secret once it exists, so that it is made once. Chapter 9 explains templates.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: appdatabase
spec:
  compositeTypeRef:
    apiVersion: platform.k8s-notes.example/v1
    kind: AppDatabase
  mode: Pipeline
  pipeline:
  - step: secret
    functionRef:
      name: function-go-templating
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |
          {{- $xr := .observed.composite.resource }}
          {{- $pw := randAlphaNum 32 }}
          {{- with .observed.resources }}{{ with (index . "admin") }}
          {{- with .resource.data.password }}{{ $pw = . | b64dec }}{{ end }}
          {{- end }}{{ end }}
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ $xr.metadata.name }}-admin
            labels:
              cnpg.io/reload: "true"
            annotations:
              {{ setResourceNameAnnotation "admin" }}
          type: kubernetes.io/basic-auth
          stringData:
            username: postgres
            password: {{ $pw | quote }}
            endpoint: {{ $xr.metadata.name }}-rw.{{ $xr.metadata.namespace }}.svc
            port: "5432"
  - step: compose
    functionRef:
      name: function-patch-and-transform
    input:
      apiVersion: pt.fn.crossplane.io/v1beta1
      kind: Resources
      resources:
      - name: providerconfig
        base:
          apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
          kind: ProviderConfig
          spec:
            sslMode: require
            credentials:
              source: PostgreSQLConnectionSecret
        patches:
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: metadata.name
        - type: FromCompositeFieldPath
          fromFieldPath: metadata.name
          toFieldPath: spec.credentials.connectionSecretRef.name
          transforms:
          - type: string
            string:
              type: Format
              fmt: "%s-admin"
