# Chapter 11: a Usage with a reason and no user. While it exists, Crossplane's webhook refuses every
# delete of the AppDatabase orders, and says why.
apiVersion: protection.crossplane.io/v1beta1
kind: Usage
metadata:
  name: keep-orders
  namespace: team-a
spec:
  of:
    apiVersion: platform.k8s-notes.example/v1
    kind: AppDatabase
    resourceRef:
      name: orders
  reason: the shop takes orders from this database; ask team-a before deleting it
