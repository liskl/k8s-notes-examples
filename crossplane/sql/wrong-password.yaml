# Chapter 6, throwaways: a ProviderConfig whose Secret (pg-wrong, made by the step with a random
# password) does not hold the superuser's password, and one Database through it.
apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: pg-wrong
  namespace: data
spec:
  sslMode: require
  credentials:
    source: PostgreSQLConnectionSecret
    connectionSecretRef:
      name: pg-wrong
---
apiVersion: postgresql.sql.m.crossplane.io/v1alpha1
kind: Database
metadata:
  name: nope
  namespace: data
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: pg-wrong
  forProvider: {}
