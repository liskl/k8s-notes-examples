# What a watching Object needs on top: the provider watches a kind across the whole cluster, not one
# namespace, so it must be able to list and watch that kind everywhere. Read only: writing stays in the
# Role in sandbox (chapter 3).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: provider-kubernetes-watch
rules:
- apiGroups: [""]
  resources: ["resourcequotas"]
  verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-watch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: provider-kubernetes-watch
subjects:
- kind: ServiceAccount
  name: provider-kubernetes
  namespace: crossplane-system
