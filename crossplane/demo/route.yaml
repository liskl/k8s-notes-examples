# Chapter 5: the demo app at No. 00's door, as orders.localhost. The route hangs on the lab's one
# Gateway, the way No. 00's podinfo route does.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo
  namespace: data
spec:
  parentRefs:
  - name: http
    namespace: kgateway-system
  hostnames:
  - orders.localhost
  rules:
  - backendRefs:
    - name: demo
      port: 80
