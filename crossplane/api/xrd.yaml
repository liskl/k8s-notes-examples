# Chapter 7: the same API with a second version, v1, and two printer columns. v1 is the referenceable
# version: the one Compositions name and the API server stores. v1alpha1 is still served. Nothing converts
# between the two, so both carry the same schema: a new version here is a new name, not a new shape.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: appdatabases.platform.k8s-notes.example
spec:
  scope: Namespaced
  group: platform.k8s-notes.example
  names:
    kind: AppDatabase
    plural: appdatabases
  versions:
  - name: v1alpha1
    served: true
    referenceable: false
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              storage:
                description: The size of the database's volume. It can grow, never shrink.
                type: string
                default: 1Gi
                pattern: "^[1-9][0-9]*(Mi|Gi)$"
                x-kubernetes-validations:
                - rule: "!quantity(self).isLessThan(quantity(oldSelf))"
                  message: storage can grow, never shrink
              schemas:
                description: The PostgreSQL schemas to make in the database.
                type: array
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [name]
                items:
                  type: object
                  required: [name]
                  properties:
                    name:
                      description: The schema's name, as PostgreSQL will keep it.
                      type: string
                      pattern: "^[a-z_][a-z0-9_]*$"
                    access:
                      description: What the app's role may do in the schema.
                      type: string
                      enum: [read, write]
                      default: read
          status:
            type: object
            properties:
              endpoint:
                description: The host name an app connects to.
                type: string
              secret:
                description: The Secret with the app role's user name and password.
                type: string
              schemas:
                description: Each schema, and whether everything made for it is ready.
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    ready:
                      type: boolean
  - name: v1
    served: true
    referenceable: true
    additionalPrinterColumns:
    - name: STORAGE
      type: string
      jsonPath: .spec.storage
    - name: ENDPOINT
      type: string
      jsonPath: .status.endpoint
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              storage:
                description: The size of the database's volume. It can grow, never shrink.
                type: string
                default: 1Gi
                pattern: "^[1-9][0-9]*(Mi|Gi)$"
                x-kubernetes-validations:
                - rule: "!quantity(self).isLessThan(quantity(oldSelf))"
                  message: storage can grow, never shrink
              schemas:
                description: The PostgreSQL schemas to make in the database.
                type: array
                maxItems: 8
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys: [name]
                items:
                  type: object
                  required: [name]
                  properties:
                    name:
                      description: The schema's name, as PostgreSQL will keep it.
                      type: string
                      pattern: "^[a-z_][a-z0-9_]*$"
                    access:
                      description: What the app's role may do in the schema.
                      type: string
                      enum: [read, write]
                      default: read
          status:
            type: object
            properties:
              endpoint:
                description: The host name an app connects to.
                type: string
              secret:
                description: The Secret with the app role's user name and password.
                type: string
              schemas:
                description: Each schema, and whether everything made for it is ready.
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    ready:
                      type: boolean
