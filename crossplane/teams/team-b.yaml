# Chapter 11: everything the platform team makes for a second team before its first request. A namespace
# under the restricted Pod Security level, the team's limit, a ServiceAccount that stands in for a member,
# and the same RoleBinding team-a got in chapter 7.
apiVersion: v1
kind: Namespace
metadata:
  name: team-b
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appdatabase-limits
  namespace: team-b
data:
  maxSchemas: "2"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev
  namespace: team-b
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: appdatabase-edit
  namespace: team-b
subjects:
- kind: ServiceAccount
  name: dev
  namespace: team-b
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane:composite:appdatabases.platform.k8s-notes.example:aggregate-to-edit
