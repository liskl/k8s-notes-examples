# What provider-helm may do in sandbox: write the two kinds the podinfo chart makes, and read what a
# Deployment makes in turn, which "wait: true" needs to tell when the rollout is over. Helm keeps each
# release as a Secret, which every provider's account may already write (chapter 4).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provider-helm
  namespace: sandbox
rules:
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
- apiGroups: ["apps"]
  resources: ["replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provider-helm
  namespace: sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: provider-helm
subjects:
- kind: ServiceAccount
  name: provider-helm
  namespace: crossplane-system
