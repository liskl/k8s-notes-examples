# A Pod to send CloudEvents from: the Broker's address is a cluster Service, so the sender sits
# inside the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: curl
  namespace: events
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: curl
    image: "curlimages/curl:8.23.0\
      @sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93"
    command: ["sleep", "infinity"]
    securityContext:
      allowPrivilegeEscalation: false
      capabilities: {drop: ["ALL"]}
