# A JobSink: every event posted to it becomes a Kubernetes Job, which finds the event as a file
# at $K_EVENT_PATH/event. The same event id twice makes one Job.
apiVersion: sinks.knative.dev/v1alpha1
kind: JobSink
metadata:
  name: job-per-event
  namespace: events
spec:
  job:
    spec:
      completions: 1
      parallelism: 1
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            seccompProfile: {type: RuntimeDefault}
          containers:
          - name: main
            image: "curlimages/curl:8.23.0\
              @sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93"
            command: ["sh", "-c", "cat $K_EVENT_PATH/event; echo"]
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
