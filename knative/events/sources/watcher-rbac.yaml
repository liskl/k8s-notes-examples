# What the ApiServerSource's ServiceAccount needs: get, list and watch on Events, in its own
# namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: watch-events
  namespace: events
rules:
- apiGroups: [""]
  resources: [events]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: watcher-watch-events
  namespace: events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: watch-events
subjects:
- kind: ServiceAccount
  name: watcher
  namespace: events
