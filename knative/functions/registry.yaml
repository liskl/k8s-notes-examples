# A container registry on the lab, for the book's Functions: nothing is pushed anywhere public.
# The nodes reach it as localhost:30500 (a NodePort, and containerd speaks plain HTTP to
# localhost); your machine reaches it the same way through "kubectl -n registry port-forward
# svc/registry 30500:5000". The registry image runs as root, so the namespace is "baseline", not
# "restricted".
apiVersion: v1
kind: Namespace
metadata:
  name: registry
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1
  selector: {matchLabels: {app: registry}}
  template:
    metadata: {labels: {app: registry}}
    spec:
      containers:
      - name: registry
        image: "registry:3.1.2\
          @sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3"
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
spec:
  type: NodePort
  selector: {app: registry}
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30500
