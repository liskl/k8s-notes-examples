# A Service whose Pods take one request at a time: containerConcurrency is a hard limit,
# enforced by queue-proxy in each Pod. More requests wait in the activator, or in queue-proxy's
# queue.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: one
  namespace: demo
spec:
  template:
    spec:
      containerConcurrency: 1
      containers:
      - image: "ghcr.io/stefanprodan/podinfo:6.15.0\
          @sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da"
        ports:
        - containerPort: 9898
        securityContext:
          runAsUser: 100
