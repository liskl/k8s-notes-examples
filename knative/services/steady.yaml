# A Service that never goes to zero and starts with two Pods: min-scale keeps one Pod at all
# times, initial-scale is how many the first Revision starts with, and scale-down-delay waits
# before giving Pods back.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: steady
  namespace: demo
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "1"
        autoscaling.knative.dev/initial-scale: "2"
        autoscaling.knative.dev/scale-down-delay: "30s"
    spec:
      containers:
      - image: "ghcr.io/stefanprodan/podinfo:6.15.0\
          @sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da"
        ports:
        - containerPort: 9898
        securityContext:
          runAsUser: 100
