# A second kgateway Gateway, for traffic that stays inside the cluster. net-gateway-api gives
# every Knative Service a cluster-local HTTPRoute as well as its external one, and the local one
# needs a Gateway of its own. Its Service is ClusterIP: nothing outside the cluster reaches it.
# No. 00's Gateway "http" stays as it is.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: local-params
  namespace: kgateway-system
spec:
  kube:
    service:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: knative-local
  namespace: kgateway-system
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: local-params
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
