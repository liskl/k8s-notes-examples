# A break: the server's certificate says it is for clients only.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: server
  namespace: mtls
spec:
  secretName: server-tls
  commonName: server
  dnsNames:
  - server.mtls.svc.cluster.local
  duration: 1h
  usages:
  - digital signature
  - client auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: lab-ca
