# Chapter 13: a good root and its CA issuer, checked with the ClusterIssuer expressions that Flux's own
# list of examples gives and many repositories copy. "failed" is true for an issuer that is not ready
# yet, and a CA issuer is not ready until its root's Secret exists: the first try fails.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: copied
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 1m
  sourceRef:
    kind: GitRepository
    name: examples
  path: ./cert-manager/gitops/breaks/copied
  prune: true
  wait: true
  healthCheckExprs:
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
    current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
