# A break: an Issuer on a CA Secret whose key is not the key of its certificate (chapter 4; the chapter
# makes that Secret by hand), and a Certificate that asks it. Every issuance fails.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: broken-checked
  namespace: demo
spec:
  ca:
    secretName: broken-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: unlucky-checked
  namespace: demo
spec:
  secretName: unlucky-checked-tls
  dnsNames:
  - unlucky.lab.example
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: broken-checked
