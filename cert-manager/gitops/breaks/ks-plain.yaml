# Chapter 13: a Kustomization around a Certificate that can never be issued, with wait: true and
# nothing else. Flux's built-in check reads Ready False as "in progress", so it waits its whole timeout.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: unlucky-plain
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s
  timeout: 1m
  sourceRef:
    kind: GitRepository
    name: examples
  path: ./cert-manager/gitops/breaks/plain
  prune: true
  wait: true
