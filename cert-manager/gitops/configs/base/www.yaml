# One leaf certificate from the lab's CA, for a server.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: www
  namespace: demo
spec:
  secretName: www-tls
  dnsNames:
  - www.lab.example
  usages:
  - digital signature
  - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: lab-ca
