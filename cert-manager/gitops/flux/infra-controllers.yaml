# Layer 1: cert-manager itself, from its Helm chart. It depends on nothing. wait: true holds this
# Kustomization until the HelmRelease is Ready, and the HelmRelease is Ready only when the chart's
# Deployments run and its startupapicheck Job has finished.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 30s   # after a failed try, come back in 30 seconds, not in 10 minutes
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: examples
  path: ./cert-manager/gitops/controllers
  prune: true
  wait: true
