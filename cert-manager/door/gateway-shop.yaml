# The same Gateway with a third listener for shop.lab.example. Nobody writes a
# Certificate for it: the annotation tells cert-manager to make one for every
# HTTPS listener that has a hostname and a certificateRef.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: http
  namespace: kgateway-system
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: gw-params
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    protocol: HTTPS
    port: 443
    hostname: www.lab.example
    tls:
      mode: Terminate
      certificateRefs:
      - name: www-tls
    allowedRoutes:
      namespaces:
        from: All
  - name: shop
    protocol: HTTPS
    port: 443
    hostname: shop.lab.example
    tls:
      mode: Terminate
      certificateRefs:
      - name: shop-tls
    allowedRoutes:
      namespaces:
        from: All
