# www.lab.example, over HTTPS only, to No. 00's podinfo.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www
  namespace: hello
spec:
  parentRefs:
  - name: http
    namespace: kgateway-system
    sectionName: https
  hostnames:
  - www.lab.example
  rules:
  - backendRefs:
    - name: podinfo
      port: 9898
