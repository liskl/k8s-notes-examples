# The same issuer, signing its updates with the TSIG key.
#   sed "s/LAB_ROOT/$(base64 -w0 ca.crt)/" issuer-tsig.yaml | kubectl apply -f -
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: pebble-dns
spec:
  acme:
    server: https://pebble.pebble.svc.cluster.local:14000/dir
    caBundle: LAB_ROOT
    privateKeySecretRef:
      name: pebble-dns-account
    solvers:
    - dns01:
        rfc2136:
          nameserver: 10.96.0.53:53
          tsigKeyName: lab-key
          tsigAlgorithm: HMACSHA256     # the default is HMACMD5
          tsigSecretSecretRef:
            name: lab-tsig              # in cert-manager's namespace
            key: secret
