# The book's first Certificate: a request, kept true by cert-manager, for one key pair in one Secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hello
  namespace: first
spec:
  secretName: hello-tls          # where the key and the certificate go
  commonName: hello.lab.example
  dnsNames:
  - hello.lab.example
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: selfsigned
