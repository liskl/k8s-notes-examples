# A self-signed certificate with no subject at all: issued, with a warning.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nameless
  namespace: first
spec:
  secretName: nameless-tls
  dnsNames:
  - nameless.lab.example
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: selfsigned
