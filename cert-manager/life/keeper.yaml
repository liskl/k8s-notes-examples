# The same, but renewal keeps the private key.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keeper
  namespace: web
spec:
  secretName: keeper-tls
  dnsNames:
  - keeper.lab.example
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: lab-ca
