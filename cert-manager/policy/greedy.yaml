# A break: team A asks for a name that belongs to team B.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: greedy
  namespace: team-a
spec:
  secretName: greedy-tls
  dnsNames:
  - web.team-b.svc.cluster.local
  usages:
  - digital signature
  - server auth
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: lab-ca
