# Team A's rule: in the namespace team-a, the lab's CA may sign server certificates
# for names under team-a.svc.cluster.local, and nothing else.
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: team-a
spec:
  allowed:
    dnsNames:
      values:
      - "*.team-a.svc.cluster.local"
      required: true
    usages:
    - digital signature
    - key encipherment
    - server auth
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: lab-ca
    namespace:
      matchNames:
      - team-a
---
# Who may use the policy: a request is only held to a policy its requester may "use".
# For a Certificate the requester is cert-manager's own ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: policy:team-a
rules:
- apiGroups: [policy.cert-manager.io]
  resources: [certificaterequestpolicies]
  verbs: [use]
  resourceNames: [team-a]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: policy:team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: policy:team-a
subjects:
- kind: ServiceAccount
  name: cert-manager
  namespace: cert-manager
