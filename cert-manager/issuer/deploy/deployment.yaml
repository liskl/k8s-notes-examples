# The issuer, from the published image. The book pins this image by digest (name:tag@sha256:...);
# the tag alone is written here so the file reads the same for every release.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-issuer
  namespace: lab-issuer
  labels:
    app.kubernetes.io/name: lab-issuer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lab-issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lab-issuer
    spec:
      serviceAccountName: lab-issuer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: lab-issuer
          image: ghcr.io/liskl/k8s-notes-examples/lab-issuer:1.0.1@sha256:567ab191a5a07fe6eeec5ed8b5e520b7c67eea098b7ad2b8b96b49995cc93b5a
          # The defaults, written out so they can be read and changed here. The README lists every flag.
          args:
            - -zone=lab.example
            - -max-lifetime=24h
            - -max-retry-duration=2m
            - -set-ca=false
          env:
            # Where a LabClusterIssuer's Secret is read from, unless -cluster-resource-namespace says.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
