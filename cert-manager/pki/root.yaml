# The lab's root CA: a certificate that signs itself and may sign others (isCA).
# It lives in cert-manager's own namespace, where a ClusterIssuer looks for its Secret.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-root
  namespace: cert-manager
spec:
  isCA: true
  commonName: lab root CA
  subject:
    organizations:
    - k8s-notes lab
  secretName: lab-root
  duration: 87600h               # ten years
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never        # a renewal keeps the key, so what it signed still verifies
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: selfsigned
---
# An issuer that signs with the root's key.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-root-ca
spec:
  ca:
    secretName: lab-root
