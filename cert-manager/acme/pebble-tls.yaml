# The ACME server needs a serving certificate of its own. The lab's CA signs it,
# so cert-manager can check who it is talking to.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pebble-tls
  namespace: pebble
spec:
  secretName: pebble-tls
  dnsNames:
  - pebble.pebble.svc.cluster.local
  - pebble.pebble.svc
  usages:
  - digital signature
  - server auth
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: lab-ca
