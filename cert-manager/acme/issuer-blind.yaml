# A break: an ACME issuer that cannot check Pebble's serving certificate,
# because nothing tells it about the lab's CA.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: pebble
spec:
  acme:
    server: https://pebble.pebble.svc.cluster.local:14000/dir
    privateKeySecretRef:
      name: pebble-account
    solvers:
    - http01:
        gatewayHTTPRoute:
          serviceType: ClusterIP
          parentRefs:
          - name: http
            namespace: kgateway-system
            kind: Gateway
