# Publishes Field Guide 04's demo image, ghcr.io/<owner>/k8s-notes-examples/spiffe-demo: one static
# go-spiffe binary that talks to the SPIRE agent's Workload API (spire/demo-image/main.go says what it
# does). Run it by hand, with the tag to publish:
#
#   gh workflow run spire-demo-image.yaml -R <owner>/k8s-notes-examples -f tag=1.0.0
#
# It builds for linux/amd64 and linux/arm64 in one run; Go cross-compiles, so no emulation. The book pins
# the image by digest, so a reader never needs to run this.
name: spire-demo-image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example 1.0.0'
        required: true
        type: string
concurrency:
  group: spire-demo-image
  cancel-in-progress: false
permissions:
  contents: read
  packages: write   # push to ghcr.io with the workflow's GITHUB_TOKEN
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag and name the image
        id: names
        env:
          TAG: ${{ inputs.tag }}
        run: |
          re='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          [[ $TAG =~ $re ]] || { echo "not a valid image tag: $TAG" >&2; exit 1; }
          # ghcr.io wants lower case
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/spiffe-demo:$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: spire/demo-image
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            TAG=${{ inputs.tag }}
            SOURCE=https://github.com/${{ github.repository }}
          tags: ${{ steps.names.outputs.image }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
