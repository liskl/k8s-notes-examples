# kafka-worker: a member of the consumer group "workers" on the topic "events", 1 s a record, committing each.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-worker
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: {app: kafka-worker}
  template:
    metadata:
      labels: {app: kafka-worker}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["kafka-work", "-topic", "events", "-group", "workers", "-each", "1s"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
