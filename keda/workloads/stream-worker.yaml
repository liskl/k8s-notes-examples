# stream-worker: reads the Redis stream "orders" as one of the consumer group "workers", 2 s an entry, and
# acknowledges each when done.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-worker
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: {app: stream-worker}
  template:
    metadata:
      labels: {app: stream-worker}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["stream-work", "-stream", "orders", "-group", "workers", "-each", "2s"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-passwords, key: redis}}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
