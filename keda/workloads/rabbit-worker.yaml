# rabbit-worker: takes jobs from the queue "tasks" one at a time (prefetch 1) and acknowledges each when done.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbit-worker
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: {app: rabbit-worker}
  template:
    metadata:
      labels: {app: rabbit-worker}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["rabbit-work", "-queue", "tasks", "-each", "2s"]
          env:
            - name: RABBITMQ_URL
              valueFrom: {secretKeyRef: {name: lab-passwords, key: rabbitmq-url}}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
