# pg-worker: takes a 'todo' row from the table tasks (FOR UPDATE SKIP LOCKED), 2 s each, and marks it done.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-worker
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: {app: pg-worker}
  template:
    metadata:
      labels: {app: pg-worker}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["pg-work", "-each", "2s"]
          env:
            - {name: PGHOST, value: postgres.postgres}
            - {name: PGUSER, value: lab}
            - {name: PGDATABASE, value: work}
            - {name: PGSSLMODE, value: disable}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: lab-passwords, key: postgres}}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
