# clock: a small web app (keda-demo serve) that starts at zero replicas, for chapter 2's cron ScaledObject.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clock
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: {app: clock}
  template:
    metadata:
      labels: {app: clock}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["serve", "-message", "tick"]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
