# reporter: an idle app, scaled on a Prometheus query.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporter
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: {app: reporter}
  template:
    metadata:
      labels: {app: reporter}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["serve", "-message", "reporter"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
