# count-amqp and count-http: two idle apps whose ScaledObjects only read the queue "held", one each way.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: count-amqp
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: {app: count-amqp}
  template:
    metadata:
      labels: {app: count-amqp}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["serve", "-message", "count-amqp"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: count-http
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: {app: count-http}
  template:
    metadata:
      labels: {app: count-http}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["serve", "-message", "count-http"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
