# values: a number KEDA reads (GET /value) only with a bearer token the API server accepts for the audience
# keda-demo, checked by a TokenReview. Its ServiceAccount may make TokenReviews (system:auth-delegator).
apiVersion: v1
kind: ServiceAccount
metadata: {name: values, namespace: demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: demo-values-tokenreview}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects: [{kind: ServiceAccount, name: values, namespace: demo}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: values
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: values}
  template:
    metadata:
      labels: {app: values}
    spec:
      serviceAccountName: values
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["value-server", "-audience", "keda-demo"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: values
  namespace: demo
spec:
  selector: {app: values}
  ports: [{port: 8080}]
