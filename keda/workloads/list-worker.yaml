# list-worker: takes jobs from the Redis list "jobs", 2 s each. It starts at zero; KEDA wakes it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: list-worker
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: {app: list-worker}
  template:
    metadata:
      labels: {app: list-worker}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["redis-work", "-list", "jobs", "-each", "2s"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: lab-passwords, key: redis}}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
