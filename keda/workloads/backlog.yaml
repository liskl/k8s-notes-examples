# backlog: a number to report, set over HTTP (POST /value?set=N) and served to Prometheus as demo_backlog.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backlog
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: backlog}
  template:
    metadata:
      labels: {app: backlog}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["value-server"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 2
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: backlog
  namespace: demo
spec:
  selector: {app: backlog}
  ports: [{port: 8080}]
