# pull-worker and push-worker: two idle apps, one scaled by the external scaler polled, one by it pushing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pull-worker
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: {app: pull-worker}
  template:
    metadata:
      labels: {app: pull-worker}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["serve", "-message", "pull"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: push-worker
  namespace: demo
spec:
  replicas: 0
  selector:
    matchLabels: {app: push-worker}
  template:
    metadata:
      labels: {app: push-worker}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["serve", "-message", "push"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
