# slow's HTTPRoute with a request timeout of 60 s, longer than its cold start.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slow
  namespace: web
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  hostnames: [slow.localhost]
  rules:
    - backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
      timeouts:
        request: 60s
