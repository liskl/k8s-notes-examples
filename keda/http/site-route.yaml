# site behind the HTTP Add-on, in the order the add-on needs: the InterceptorRoute, then its ScaledObject
# (external-push to the add-on's scaler), then the door: an HTTPRoute on No. 00's Gateway to the interceptor
# in keda, which a ReferenceGrant in keda allows. /healthz is answered by the interceptor itself
# (staticRoutes).
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: site
  namespace: web
spec:
  target:
    service: site
    port: 8080
  rules:
    - hosts: [site.localhost]
  scalingMetric:
    concurrency:
      targetValue: 10
  staticRoutes:
    - rules:
        - paths: [{value: /healthz}]
      response:
        statusCode: 200
        body: "static ok from the interceptor"
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: site
  namespace: web
spec:
  scaleTargetRef:
    name: site
  minReplicaCount: 0
  maxReplicaCount: 5
  cooldownPeriod: 30
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: site
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site
  namespace: web
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  hostnames: [site.localhost]
  rules:
    - backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: web-to-interceptor
  namespace: keda
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: web
  to:
    - group: ""
      kind: Service
      name: keda-add-ons-http-interceptor-proxy
