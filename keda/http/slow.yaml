# slow: a web app that waits 20 s before it listens, behind the add-on like site, its HTTPRoute with no
# timeouts of its own.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slow
  namespace: web
spec:
  replicas: 0
  selector:
    matchLabels: {app: slow}
  template:
    metadata:
      labels: {app: slow}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
            60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
          args: ["serve", "-startup-delay", "20s"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 1
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: slow
  namespace: web
spec:
  selector: {app: slow}
  ports: [{port: 8080}]
---
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: slow
  namespace: web
spec:
  target:
    service: slow
    port: 8080
  rules:
    - hosts: [slow.localhost]
  scalingMetric:
    concurrency:
      targetValue: 10
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: slow
  namespace: web
spec:
  scaleTargetRef:
    name: slow
  minReplicaCount: 0
  maxReplicaCount: 5
  cooldownPeriod: 30
  triggers:
    - type: external-push
      metadata:
        scalerAddress: keda-add-ons-http-external-scaler.keda:9090
        interceptorRoute: slow
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slow
  namespace: web
spec:
  parentRefs:
    - name: http
      namespace: kgateway-system
  hostnames: [slow.localhost]
  rules:
    - backendRefs:
        - name: keda-add-ons-http-interceptor-proxy
          namespace: keda
          port: 8080
