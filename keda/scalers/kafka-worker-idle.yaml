# The same, allowed to run more workers than the topic has partitions (the extra ones sit idle).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-worker
  namespace: demo
spec:
  scaleTargetRef:
    name: kafka-worker
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 6
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.kafka:9092
        consumerGroup: workers
        topic: events
        lagThreshold: "5"
        offsetResetPolicy: earliest
        allowIdleConsumers: "true"
