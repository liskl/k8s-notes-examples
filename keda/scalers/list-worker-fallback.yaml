# list-worker with a fallback: when its trigger fails more than 3 times in a row, it runs 2 replicas.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: list-worker
  namespace: demo
spec:
  scaleTargetRef:
    name: list-worker
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 6
  fallback:
    failureThreshold: 3
    replicas: 2
  triggers:
    - type: redis
      metadata:
        address: redis.redis:6379
        listName: jobs
        listLength: "5"
      authenticationRef:
        name: redis
