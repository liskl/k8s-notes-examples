# The same queue counted two ways: over AMQP, and over the http API.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: count-amqp
  namespace: demo
spec:
  scaleTargetRef:
    name: count-amqp
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 6
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: held
        mode: QueueLength
        value: "100"
      authenticationRef:
        name: rabbitmq
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: count-http
  namespace: demo
spec:
  scaleTargetRef:
    name: count-http
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 6
  triggers:
    - type: rabbitmq
      metadata:
        protocol: http
        queueName: held
        mode: QueueLength
        value: "100"
      authenticationRef:
        name: rabbitmq-http
