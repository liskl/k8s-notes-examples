# stream-worker scales on the lag of its consumer group: entries added to "orders" that no worker has read.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: stream-worker
  namespace: demo
spec:
  scaleTargetRef:
    name: stream-worker
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 6
  triggers:
    - type: redis-streams
      metadata:
        address: redis.redis:6379
        stream: orders
        consumerGroup: workers
        lagCount: "5"
      authenticationRef:
        name: redis
