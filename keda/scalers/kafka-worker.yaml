# kafka-worker scales on the group's lag: one replica for every 5 records not yet committed, up to 6.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-worker
  namespace: demo
spec:
  scaleTargetRef:
    name: kafka-worker
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 6
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka.kafka:9092
        consumerGroup: workers
        topic: events
        lagThreshold: "5"
        offsetResetPolicy: earliest
