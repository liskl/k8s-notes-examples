# pg-worker scales on a SQL count: one replica for every 5 rows still 'todo'.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pg-worker
  namespace: demo
spec:
  scaleTargetRef:
    name: pg-worker
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 6
  triggers:
    - type: postgresql
      metadata:
        query: "SELECT count(*) FROM tasks WHERE state = 'todo'"
        targetQueryValue: "5"
      authenticationRef:
        name: postgres
