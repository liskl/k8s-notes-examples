# reporter scales on a PromQL query: the sum of demo_backlog, one replica for every 5.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: reporter
  namespace: demo
spec:
  scaleTargetRef:
    name: reporter
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 6
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring:9090
        query: sum(demo_backlog)
        threshold: "5"
