# The same ScaledObject with its window moved to the first minute of January 1st: the trigger goes
# inactive, and KEDA takes clock back to zero once cooldownPeriod has passed.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: clock
  namespace: demo
spec:
  scaleTargetRef:
    name: clock
  minReplicaCount: 0
  maxReplicaCount: 5
  cooldownPeriod: 30
  triggers:
    - type: cron
      metadata:
        timezone: UTC
        start: "0 0 1 1 *"
        end: "1 0 1 1 *"
        desiredReplicas: "3"
