# Field Guide 06's values for the keda chart 2.21.0. The three images run by digest (the chart puts a tag
# here; "tag@digest" is a valid image reference), and KEDA's own Prometheus metrics are on (chapter 9 reads
# them). Every helm upgrade in the book passes this file again: Helm starts an upgrade from the chart's
# defaults plus the files it is given.
image:
  keda:
    tag: 2.21.0@sha256:81fe6547ce8d1cc29273f887b76507e9b853e5bc1f875ec23fe60061a38ed809
  metricsApiServer:
    tag: 2.21.0@sha256:255375037fe592732eeb554743aae360c2da88cf0b9b1258d0a987ef885f0881
  webhooks:
    tag: 2.21.0@sha256:e1969628cca6123e32eea13c47c75817091af2657fa68d9d0d58a8620d1b75b1
prometheus:
  operator:
    enabled: true
  metricServer:
    enabled: true
