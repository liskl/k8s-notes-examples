# Prometheus v3.15.1 for chapter 9, in the namespace monitoring (Pod Security restricted), as nobody
# (uid 65534), keeping 2 hours of data in an emptyDir. It scrapes three things by name every 10 s: KEDA's
# operator and metrics server (values/keda.yaml turned their metrics on) and the demo's backlog app.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
    scrape_configs:
      - job_name: keda-operator
        static_configs: [{targets: ["keda-operator.keda:8080"]}]
      - job_name: keda-metrics-apiserver
        static_configs: [{targets: ["keda-operator-metrics-apiserver.keda:8080"]}]
      - job_name: backlog
        static_configs: [{targets: ["backlog.demo:8080"]}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: "quay.io/prometheus/prometheus:v3.15.1@sha256:\
            fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2"
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2h
          ports: [{containerPort: 9090}]
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - {name: config, configMap: {name: prometheus}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
