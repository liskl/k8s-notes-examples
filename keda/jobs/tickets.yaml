# tickets: one Job for each ticket on the Redis list "tickets" (listLength 1), at most 5 at once; each Job
# takes one ticket, works 10 s and exits. KEDA keeps the last 3 finished Jobs and the last 2 failed ones.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: tickets
  namespace: demo
spec:
  pollingInterval: 5
  maxReplicaCount: 5
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTargetRef:
    backoffLimit: 0
    template:
      spec:
        restartPolicy: Never
        securityContext:
          runAsNonRoot: true
          seccompProfile: {type: RuntimeDefault}
        containers:
          - name: job
            image: "ghcr.io/liskl/k8s-notes-examples/keda-demo:1.0.0@sha256:\
                60fb369efffd8229e6f406d1010d5a09caa680668b182edc2bae1ed868868fe6"
            args: ["job", "-list", "tickets", "-each", "10s"]
            env:
              - name: REDIS_PASSWORD
                valueFrom: {secretKeyRef: {name: lab-passwords, key: redis}}
            resources:
              requests: {cpu: 10m, memory: 16Mi}
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: [ALL]}
  triggers:
    - type: redis
      metadata:
        address: redis.redis:6379
        listName: tickets
        listLength: "1"
      authenticationRef:
        name: redis
