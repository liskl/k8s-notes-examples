# pg-worker with a connection string whose host does not resolve.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pg-worker
  namespace: demo
spec:
  scaleTargetRef:
    name: pg-worker
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 6
  triggers:
    - type: postgresql
      metadata:
        query: "SELECT count(*) FROM tasks WHERE state = 'todo'"
        targetQueryValue: "5"
      authenticationRef:
        name: postgres-bad
