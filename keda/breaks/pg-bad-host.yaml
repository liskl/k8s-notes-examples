# pg-worker with a host that does not resolve.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pg-worker
  namespace: demo
spec:
  scaleTargetRef:
    name: pg-worker
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 0
  maxReplicaCount: 6
  triggers:
    - type: postgresql
      metadata:
        host: postgres.nowhere
        port: "5432"
        userName: lab
        dbName: work
        sslmode: disable
        query: "SELECT count(*) FROM tasks WHERE state = 'todo'"
        targetQueryValue: "5"
      authenticationRef:
        name: postgres
