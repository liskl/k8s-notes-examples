# Breaks a webhook rule: a second ScaledObject on a Deployment that already has one.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: sized-again
  namespace: demo
spec:
  scaleTargetRef:
    name: sized
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: cron
      metadata:
        timezone: UTC
        start: "0 0 1 1 *"
        end: "1 0 1 1 *"
        desiredReplicas: "2"
