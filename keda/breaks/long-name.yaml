# Breaks a webhook rule: a name of 64 characters (it becomes a label value, at most 63).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  namespace: demo
spec:
  scaleTargetRef:
    name: sized
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: cron
      metadata:
        timezone: UTC
        start: "0 0 1 1 *"
        end: "1 0 1 1 *"
        desiredReplicas: "2"
