# checker on Redis, through a TriggerAuthentication that does not exist.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: checker
  namespace: demo
spec:
  scaleTargetRef:
    name: checker
  pollingInterval: 5
  minReplicaCount: 0
  maxReplicaCount: 3
  triggers:
    - type: redis
      metadata:
        address: redis.redis:6379
        listName: checks
        listLength: "5"
      authenticationRef:
        name: redis-missing
