# spiffe-helper 0.12.3: ask the agent for this Pod's SVIDs, write them as files for an app that reads
# files, and rewrite them at every renewal. The key is 0640: the app's group may read it, no one else. A mode
# without the owner's write bit (0444) breaks the first renewal: the helper cannot rewrite its own file.
agent_address = "/spiffe-workload-api/spire-agent.sock"
cert_dir = "/certs"
svid_file_name = "svid.pem"
svid_key_file_name = "svid_key.pem"
svid_bundle_file_name = "svid_bundle.pem"
key_file_mode = 0640
jwt_svids = [{jwt_audience = "spiffe-demo", jwt_svid_file_name = "jwt_svid.token"}]
jwt_svid_file_mode = 0640
jwt_bundle_file_name = "jwt_bundle.json"
jwt_bundle_file_mode = 0640
health_checks {
  listener_enabled = true
}
