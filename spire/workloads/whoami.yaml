# A workload that asks the SPIRE agent who it is: spiffe-demo watch prints a line each time its SVID or its
# bundle changes. Its identity comes from its namespace and ServiceAccount, nothing in this file names it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: whoami
  namespace: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: demo
spec:
  selector:
    matchLabels: {app: whoami}
  template:
    metadata:
      labels: {app: whoami}
    spec:
      serviceAccountName: whoami
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: demo
          image: "ghcr.io/liskl/k8s-notes-examples/spiffe-demo:1.0.0@sha256:\
            6c311eb45eb1683ba1a5e2c4ecac8c260d6e008efcf06a12e0145d4c0528287d"
          args: [watch]
          env:
            - name: SPIFFE_ENDPOINT_SOCKET              # where go-spiffe finds the Workload API
              value: unix:///spiffe-workload-api/spire-agent.sock
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true}
      volumes:
        - name: spiffe-workload-api                     # the agent's socket, mounted by the SPIFFE CSI driver
          csi: {driver: csi.spiffe.io, readOnly: true}
