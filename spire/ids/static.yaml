# Static entries declared in Kubernetes: a node alias for every agent of cluster lab (its parent is the
# server, so it is an entry for nodes), and one workload under it. IDs may be paths: the trust domain is
# filled in.
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterStaticEntry
metadata:
  name: nodes-lab
spec:
  className: spire-mgmt-spire
  spiffeID: /node/lab
  parentID: /spire/server
  selectors: ["k8s_psat:cluster:lab"]
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterStaticEntry
metadata:
  name: fetch
spec:
  className: spire-mgmt-spire
  spiffeID: /static/fetch
  parentID: /node/lab
  selectors: ["k8s:ns:demo", "k8s:sa:fetch"]
