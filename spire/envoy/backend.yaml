# Envoy in front of a plain HTTP app (127.0.0.1:8080): it takes mTLS on 8443 and lets in only the client
# Envoy's SPIFFE ID. Its certificate and its trust bundles come from the SPIRE agent by SDS, over the Workload
# API socket: "default" is the Pod's own SVID, "ALL" the bundles it trusts. Nothing is written to disk.
node:
  id: envoy-backend
  cluster: lab
admin:
  address:
    socket_address: {address: 127.0.0.1, port_value: 9901}
static_resources:
  listeners:
    - name: inbound_mtls
      address:
        socket_address: {address: 0.0.0.0, port_value: 8443}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.\
                  v3.HttpConnectionManager"
                stat_prefix: inbound
                forward_client_cert_details: sanitize_set
                set_current_client_cert_details: {uri: true}
                route_config:
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/"}
                          route: {cluster: app}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificate_sds_secret_configs:
                  - name: default                  # this Pod's X.509-SVID, from the agent
                    sds_config: &spire
                      resource_api_version: V3
                      api_config_source:
                        api_type: GRPC
                        transport_api_version: V3
                        grpc_services: [{envoy_grpc: {cluster_name: spire_agent}}]
                combined_validation_context:
                  default_validation_context:
                    match_typed_subject_alt_names:     # only this caller
                      - san_type: URI
                        matcher: {exact: "spiffe://lab.k8s-notes.test/app/envoy-client"}
                  validation_context_sds_secret_config:
                    name: ALL                          # every bundle the agent gives this Pod
                    sds_config: *spire
  clusters:
    - name: spire_agent
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: {http2_protocol_options: {}}
      load_assignment:
        cluster_name: spire_agent
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    pipe: {path: /spiffe-workload-api/spire-agent.sock}
    - name: app
      connect_timeout: 1s
      load_assignment:
        cluster_name: app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 8080}
